name: Credential checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/secret-scanner"
          tar -xzf "$archive" -C "$RUNNER_TEMP/secret-scanner" gitleaks
      - name: Verify provider credential detection
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/secret-scanner/gitleaks
        run: python3 .github/scripts/verify-secret-scanner.py
      - name: Scan complete Git history
        shell: bash
        run: |
          set -euo pipefail
          if "$RUNNER_TEMP/secret-scanner/gitleaks" git \
            --config .gitleaks.toml --log-opts=--all --redact=100 --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"; then
            echo 'Credential check passed across fetched Git history.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Credential check failed. Resolve findings before merging. Credential values are redacted.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
