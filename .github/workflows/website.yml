name: Devotion candidate checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-24.04
    # Match the locked Playwright version and use its preinstalled browsers and Linux dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --ipc=host
    timeout-minutes: 20
    env:
      DEVOTION_ISOLATED_PREVIEW: '1'
      DEVOTION_SERVE_DIST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:workspace
      - run: npm run build
      - run: npm run verify
      - run: npm run test:workspace-flow
      - run: npm run test:editorial
      - run: npm run test:audit
